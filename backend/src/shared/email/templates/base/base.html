<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TRU Connect{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F6F8; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F6F8; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="background-color:#0B2447; padding:24px 32px;">
              <span style="color:#FFFFFF; font-size:20px; font-weight:700;">TRU Connect</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px; border-top:1px solid #D0D4D9;">
              <p style="margin:0; color:#6B7280; font-size:12px; line-height:1.5;">
                TRU Connect &mdash; part of the TruePoint ecosystem.<br>
                This is an automated message; please do not reply directly to this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
